<style>
  :root{
    --bg-page:#101124;
    --bg-shell:#181a30;
    --bg-panel:#21233f;
    --bg-panel-2:#282a4a;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --text-primary:#f3efe4;
    --text-muted:#9a9dc4;
    --text-faint:#5f6289;
    --gold:#e7b563;
    --gold-dim:rgba(231,181,99,0.16);
    --rose:#e08f8f;
    --rose-dim:rgba(224,143,143,0.16);
    --sage:#8fbfa0;
    --lavender:#b8a4e3;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-page);
    background-image: radial-gradient(circle at 20% 0%, #1a1c38 0%, var(--bg-page) 45%);
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg-shell);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  @media (min-width:461px){
    body{padding:28px 0;}
    .shell{min-height:calc(100vh - 56px); border-radius:28px; overflow:hidden; border:1px solid var(--line);}
  }

  /* ---- lock screen ---- */
  .lock-screen{
    position:absolute; inset:0; z-index:50; background:var(--bg-shell);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
  }
  .lock-brand{
    font-family:'Fraunces',serif; font-weight:500; font-size:17px; color:var(--text-primary);
    display:flex; align-items:center; gap:7px; margin-bottom:26px;
  }
  .lock-dots{display:flex; gap:16px; margin-bottom:8px;}
  .lock-dot{width:13px;height:13px;border-radius:50%; border:1.5px solid var(--line-strong); background:transparent; transition:background .1s, border-color .1s;}
  .lock-dot.filled{background:var(--gold); border-color:var(--gold);}
  .lock-dot.error{background:var(--rose); border-color:var(--rose);}
  .lock-dots.shake{animation:shakeX .4s;}
  @keyframes shakeX{
    10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(3px);}
    30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);}
  }
  .lock-error{font-size:12px; color:var(--rose); height:16px; margin:10px 0 18px;}
  .keypad{display:grid; grid-template-columns:repeat(3,70px); gap:16px;}
  .key, .key-spacer{width:70px; height:70px;}
  .key{
    border-radius:50%; background:var(--bg-panel); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-primary); user-select:none;
  }
  .key:active{background:var(--bg-panel-2);}
  .key .num{font-family:'Fraunces',serif; font-size:21px; font-weight:500; line-height:1;}
  .key .letters{font-size:8.5px; letter-spacing:1.5px; color:var(--text-faint); margin-top:3px;}
  .key.action{background:transparent; border:none; color:var(--text-muted); font-size:13px;}

  /* ---- top bar / identity ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand{
    font-family:'Fraunces',serif; font-weight:500; font-size:16px; letter-spacing:0.2px;
    display:flex; align-items:center; gap:7px;
  }
  .gear{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:transparent; border:none; color:var(--text-muted); cursor:pointer;
  }
  .gear:hover{color:var(--text-primary);}

  .idbar{
    margin:0 18px 14px; padding:4px; background:var(--bg-panel);
    border-radius:999px; display:flex; border:1px solid var(--line);
  }
  .idbar button{
    flex:1; border:none; background:transparent; color:var(--text-muted);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    padding:9px 6px; border-radius:999px; cursor:pointer; transition:background .15s, color .15s;
  }
  .idbar button.active{background:var(--gold-dim); color:var(--gold);}

  /* ---- content ---- */
  .content{flex:1; overflow-y:auto; padding:4px 18px 100px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---- hero (today) ---- */
  .hero{position:relative; text-align:center; padding:38px 14px 34px;}
  .hero-caption{font-size:11.5px; color:var(--text-faint); margin-top:10px; letter-spacing:0.2px;}

  .corner-deco{position:absolute; opacity:0.75; pointer-events:none;}
  .corner-deco.bl{bottom:2px; left:2px;}
  .corner-deco.br{bottom:2px; right:6px;}

  .corner-badge{
    position:absolute; top:0;
    background:var(--bg-panel); border:1px solid var(--line-strong);
    border-radius:16px; padding:9px 13px; text-align:center; min-width:64px;
  }
  .corner-badge.right{right:0; cursor:pointer;}
  .corner-badge.left{left:0; cursor:default;}
  .corner-badge .n{font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:var(--gold); line-height:1;}
  .corner-badge .l{font-size:8.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; line-height:1.3;}

  .couple-photo{
    width:112px; height:112px; border-radius:50%; margin:0 auto;
    background-size:cover; background-position:center; background-color:var(--bg-panel-2);
    border:2px solid rgba(231,181,99,0.45); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .couple-photo.empty{border:2px dashed var(--line-strong);}
  .couple-photo .cp-icon{color:var(--text-faint);}

  .card{
    background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:18px; margin-bottom:14px;
  }
  .card.hypo{border-color:rgba(184,164,227,0.35);}
  .card-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:10px;}
  .card-label.hypo{color:var(--lavender);}
  .card-sub{font-size:12px; color:var(--text-faint); margin-top:8px; line-height:1.4;}
  .question-text{
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:19px; line-height:1.4; color:var(--text-primary); margin-bottom:16px;
  }
  .card.hypo .question-text{margin-bottom:0;}
  .answer-row{margin-bottom:12px;}
  .answer-row:last-child{margin-bottom:0;}
  .answer-row .who{font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:500;}
  textarea, input[type=text], input[type=date], select{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:var(--radius-sm); color:var(--text-primary); font-family:'Inter',sans-serif;
    font-size:14px; padding:10px 12px; resize:none; outline:none;
  }
  select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239a9dc4' stroke-width='1.4' fill='none'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:30px;}
  textarea:focus, input:focus, select:focus{border-color:var(--gold);}
  textarea{min-height:44px;}

  /* selfies */
  .selfie-row{display:flex; gap:14px;}
  .selfie-slot{flex:1; text-align:center;}
  .selfie-thumb{
    width:100%; aspect-ratio:1; border-radius:var(--radius-md);
    background-size:cover; background-position:center; background-color:var(--bg-panel-2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-bottom:7px; color:var(--text-faint); font-size:11px; flex-direction:column; gap:5px;
  }
  .selfie-thumb.readonly{cursor:default;}
  .selfie-slot .who{font-size:11.5px; color:var(--text-muted);}

  .readiness-block{margin-bottom:14px;}
  .readiness-block:last-child{margin-bottom:0;}
  .readiness-block .who{font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:500;}
  .mood-row{display:flex; gap:8px;}
  .mood-dot{
    flex:1; height:32px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-panel-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mood-dot.readonly{cursor:default;}
  .mood-dot .fill{width:9px;height:9px;border-radius:50%;background:var(--text-faint);}
  .mood-dot.active{background:var(--gold-dim); border-color:rgba(231,181,99,0.5);}
  .mood-dot.active .fill{background:var(--gold);}
  .scale-caption{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-faint); margin-top:6px;}

  .status-partner{font-size:12.5px; color:var(--text-muted); margin-top:10px; line-height:1.4;}
  .status-partner b{color:var(--text-primary); font-weight:500;}

  .ping-btn{
    width:100%; background:var(--rose-dim); border:1px solid rgba(224,143,143,0.4);
    color:var(--rose); font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    padding:13px; border-radius:999px; cursor:pointer; margin-top:4px;
  }
  .ping-feed{margin-top:12px;}
  .ping-item{font-size:12.5px; color:var(--text-muted); padding:6px 0; border-top:1px solid var(--line);}
  .ping-item b{color:var(--text-primary); font-weight:500;}

  /* ---- composer / entries ---- */
  .composer{display:flex; gap:8px; margin-bottom:4px;}
  .composer textarea{flex:1;}
  .composer input{flex:1;}
  .btn-small{
    background:var(--gold-dim); border:1px solid rgba(231,181,99,0.4); color:var(--gold);
    border-radius:var(--radius-sm); padding:0 14px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .entry{padding:14px 0; border-top:1px solid var(--line);}

  .entry .text{font-size:14.5px; line-height:1.5; color:var(--text-primary);}
  .empty{text-align:center; color:var(--text-faint); font-size:13px; padding:30px 10px;}

  .building-img{width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:var(--radius-md); background:var(--bg-panel-2); margin-bottom:10px; display:block;}
  .building-name{font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:16px; color:var(--text-primary); margin-bottom:4px;}
  .building-link{font-size:12px; color:var(--gold); text-decoration:none;}
  .building-link:hover{text-decoration:underline;}
  .reveal-toggle{font-size:12.5px; color:var(--gold); cursor:pointer; display:inline-block;}

  /* ---- bucket list ---- */
  .bl-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line);}
  .bl-row:first-child{border-top:none;}

    width:20px;height:20px;border-radius:50%; border:1.5px solid var(--line-strong);

  }
  .bl-check.done{background:var(--sage); border-color:var(--sage);}
  .bl-check.done:after{content:'✓'; font-size:11px; color:#12241a;}
  .bl-text{flex:1; font-size:14.5px;}
  .bl-text.done{color:var(--text-faint); text-decoration:line-through;}
  .bl-by{font-size:11px; color:var(--text-faint);}

  .private-toggle{
    text-align:center; font-size:12.5px; color:var(--text-muted);
    border:1px dashed var(--line-strong); border-radius:999px;
    padding:11px; cursor:pointer; margin-bottom:14px;
  }
  .private-toggle:hover{color:var(--text-primary); border-color:var(--line-strong);}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;}
  .visit-actions{display:flex; gap:10px; margin-top:14px;}
  .btn{
    flex:1; text-align:center; padding:11px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-gold{background:var(--gold); color:#241a08; border:none;}
  .btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--text-muted);}
  .history-item{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .history-item span{color:var(--text-faint); font-size:12px;}

  /* ---- nav ---- */
  .nav{
    position:sticky; bottom:0; display:flex; background:rgba(24,26,48,0.92);
    backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .nav button{
    flex:1; background:none; border:none; color:var(--text-faint); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:'Inter',sans-serif;
  }
  .nav button.active{color:var(--gold);}
  .nav svg{width:20px;height:20px;}
  .nav span{font-size:10.5px; font-weight:500;}

  /* ---- overlay/modal ---- */
  .overlay{
    position:absolute; inset:0; background:rgba(10,10,20,0.72); display:none;
    align-items:center; justify-content:center; padding:24px; z-index:20;
  }
  .overlay.show{display:flex;}
  .modal{background:var(--bg-panel); border:1px solid var(--line-strong); border-radius:var(--radius-lg); padding:22px; width:100%; max-width:340px;}
  .modal.pm-modal{max-width:380px;}
  .modal h3{font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:0 0 6px;}
  .modal p{font-size:13px; color:var(--text-muted); margin:0 0 16px; line-height:1.5;}
  .modal .field{margin-bottom:12px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .link-danger{color:var(--rose); font-size:12.5px; cursor:pointer; text-align:center; margin-top:18px;}
  .link-muted{color:var(--text-muted); font-size:12.5px; cursor:pointer; text-align:center; margin-top:10px;}

  .pm-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-height:240px; overflow-y:auto; margin-bottom:16px;}
  .pm-thumb{position:relative; aspect-ratio:1; border-radius:8px; background-size:cover; background-position:center; background-color:var(--bg-panel-2); border:1px solid var(--line);}
  .pm-del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--rose); color:#2a1414; border:none; font-size:12px; line-height:1; cursor:pointer;}

  .toast{
    position:absolute; left:50%; bottom:88px; transform:translateX(-50%) translateY(10px);
    background:var(--bg-panel-2); border:1px solid var(--line-strong); color:var(--text-primary);
    font-size:13px; padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:30; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading{display:flex; align-items:center; justify-content:center; min-height:70vh; color:var(--text-muted); font-size:13px;}
</style>
</head>

    var h=Math.floor(m/60); if(h<24) return h+"h ago";
    var dd=Math.floor(h/24); return dd+"d ago";
  }
  function daysUntil(iso){
    var target=new Date(iso+"T00:00:00"), now=new Date();
    now.setHours(0,0,0,0);
    return Math.round((target-now)/86400000);
  }
  function computeTogether(){
    var start = new Date(2024,10,1,0,0,0);
    var diffMs = Date.now() - start.getTime();
    if(diffMs<0) return {days:0, hours:0};
    return {
      days: Math.floor(diffMs/86400000),
      hours: Math.floor((diffMs % 86400000)/3600000)
    };
  }

  function escapeHtml(str){

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('file read failed')); };
      reader.readAsDataURL(file);
    });
  }

    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('lookup failed');
      return r.json();
    }).then(function(data){
      buildingCache[title] = data;
      return data;
    });

  /* ---------------- firebase / storage ---------------- */
  // ROOT_REF holds the small, singleton fields: config, visits, pings, journal, bucketlist.
  // Photos and daily check-ins live in their own subcollections so no single document
  // ever gets close to Firestore's 1MB-per-document ceiling.
  var ROOT_PATH = ['app','sameSky'];
  function rootRef(){ return doc(db, ROOT_PATH[0], ROOT_PATH[1]); }
  function checkinsCol(){ return collection(db, ROOT_PATH[0], ROOT_PATH[1], 'checkins'); }
  function selfiesCol(){ return collection(db, ROOT_PATH[0], ROOT_PATH[1], 'selfies'); }
  function galleryCol(){ return collection(db, ROOT_PATH[0], ROOT_PATH[1], 'gallery'); }

  async function fbGetRootField(field, fallback){
    try{
      var snap = await getDoc(rootRef());
      if(!snap.exists()) return fallback;
      var data = snap.data();
      return (data && data[field]!==undefined) ? data[field] : fallback;
    }catch(e){ return fallback; }
  }
  async function fbSetRootField(field, value){
    try{
      var patch = {}; patch[field] = value;
      await setDoc(rootRef(), patch, {merge:true});
      return true;
    }catch(e){ return false; }
  }
  async function fbGetDateDoc(colRef, dateKey, fallback){
    try{
      var snap = await getDoc(doc(colRef, dateKey));
      return snap.exists() ? snap.data() : fallback;
    }catch(e){ return fallback; }
  }
  async function fbSetDateDoc(colRef, dateKey, data){
    try{
      await setDoc(doc(colRef, dateKey), data);
      return true;
    }catch(e){ return false; }
  }
  async function fbGetGallery(){
    try{
      var q = query(galleryCol(), orderBy('order'));
      var snap = await getDocs(q);
      var out = [];
      snap.forEach(function(d){ out.push({id:d.id, data:d.data().data}); });
      return out;
    }catch(e){ return []; }
  }
  async function fbDeleteAllInCollection(colRef){
    try{
      var snap = await getDocs(colRef);
      var deletions = [];
      snap.forEach(function(d){ deletions.push(deleteDoc(d.ref)); });
      await Promise.all(deletions);
    }catch(e){ /* ignore */ }
  }

    if(!state.config) return;
    var messages = ['thinking of you 💛','miss you right now','can\'t stop smiling about you','wish you were here'];
    var msg = messages[Math.floor(Math.random()*messages.length)];
    state.pings.push({from: state.viewingAs, message: msg, ts: Date.now()});
    if(state.pings.length>20) state.pings = state.pings.slice(-20);
    renderToday();
    toast('Sent 💛');
    await fbSetRootField('pings', state.pings);
  }

  async function addMemory(){
    var input = document.getElementById('memoryInput');
    var text = input.value.trim();
    if(!text || !state.config) return;
    state.journal.push({id: uid(), author: state.viewingAs, date: todayKey(), text: text});
    input.value = '';
    renderToday();
    toast('Added');
    await fbSetRootField('journal', state.journal);
  }

  /* ---------------- selfies ---------------- */
  async function handleSelfieUpload(file){
    if(!file || !state.config) return;
    toast('Uploading…');
    try{
      var dataUrl = await compressImage(file, 480, 0.62);
      var tk = todayKey();
      state.todaySelfies[state.viewingAs] = dataUrl;
      renderToday();
      toast('Posted');
      await fbSetDateDoc(selfiesCol(), tk, state.todaySelfies);
    }catch(e){
      toast("Couldn't add that photo");
    }
  }

  /* ---------------- gallery / photo manager ---------------- */
  function openPhotoManager(){
    var ov = document.getElementById('overlay');
    renderPhotoManagerModal(ov);
    ov.classList.add('show');
  }

  function renderPhotoManagerModal(ov){
    var thumbsHtml = state.gallery.map(function(item){
      return '<div class="pm-thumb" style="background-image:url(\''+item.data+'\')"><button class="pm-del" data-id="'+item.id+'">×</button></div>';
    }).join('');
    ov.innerHTML = '<div class="modal pm-modal">' +
      '<h3>Photos of us</h3>' +
      '<p>These rotate one-per-day on the home screen. Add a batch and we\'ll cycle through them in order.</p>' +
      '<div class="pm-grid" id="pmGrid">' + (thumbsHtml || '<div class="empty small">No photos yet — add your first batch.</div>') + '</div>' +
      '<input type="file" id="pmFileInput" accept="image/*" multiple style="display:none">' +
      '<div class="modal-actions"><div class="btn btn-ghost" id="pmClose">Close</div><div class="btn btn-gold" id="pmAddBtn">Add photos</div></div>' +
      '</div>';

    document.getElementById('pmClose').onclick = function(){ ov.classList.remove('show'); renderToday(); };
    document.getElementById('pmAddBtn').onclick = function(){ document.getElementById('pmFileInput').click(); };
    document.getElementById('pmFileInput').onchange = async function(e){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(!files.length) return;
      toast('Adding photos…');
      for(var i=0;i<files.length;i++){
        try{
          var dataUrl = await compressImage(files[i], 640, 0.68);
          await addDoc(galleryCol(), {data:dataUrl, order:Date.now()+i});
        }catch(err){ /* skip file that failed to process */ }
      }
      state.gallery = await fbGetGallery();
      renderPhotoManagerModal(ov);
      toast('Photos added');
    };
    document.querySelectorAll('.pm-del').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-id');
        try{ await deleteDoc(doc(galleryCol(), id)); }catch(err){ /* ignore */ }
        state.gallery = await fbGetGallery();
        renderPhotoManagerModal(ov);
      };
    });
  }

  /* ---------------- BUCKET LIST ---------------- */
  function renderBLRows(items){
    if(!items.length) return '<div class="empty small">Nothing here yet.</div>';
    return items.map(function(item){
      return '<div class="bl-row"><div class="bl-check '+(item.done?'done':'')+'" data-id="'+item.id+'"></div>' +
        '<div class="bl-text '+(item.done?'done':'')+'">'+escapeHtml(item.text)+'<div class="bl-by">added by '+item.addedBy+'</div></div></div>';
    }).join('');
  }

  function renderBucketlist(){
    var el = document.getElementById('view-list');
    var plans = state.bucketlist.filter(function(i){ return (i.section||'plans')==='plans'; });
    var priv = state.bucketlist.filter(function(i){ return i.section==='private'; });

    var html = '<div class="card">';
    html += '<div class="card-label">Plans</div>';
    html += '<div class="composer"><input type="text" id="planInput" placeholder="Something normal to plan">';
    html += '<button class="btn-small" id="planAdd">Add</button></div>';
    html += '<div style="margin-top:8px">'+renderBLRows(plans)+'</div>';
    html += '</div>';

    html += '<div class="private-toggle" id="privateToggle">'+(privateRevealed ? '🔓 Hide private list' : '🔒 Private — tap to reveal')+'</div>';

    if(privateRevealed){
      html += '<div class="card">';
      html += '<div class="card-label">Private</div>';
      html += '<div class="composer"><input type="text" id="privateInput" placeholder="Just for us">';
      html += '<button class="btn-small" id="privateAdd">Add</button></div>';
      html += '<div style="margin-top:8px">'+renderBLRows(priv)+'</div>';
      html += '</div>';
    }

    el.innerHTML = html;

    document.getElementById('planAdd').onclick = function(){ addBucketItem('plans','planInput'); };
    document.getElementById('privateToggle').onclick = function(){ privateRevealed = !privateRevealed; renderBucketlist(); };
    var privAdd = document.getElementById('privateAdd');
    if(privAdd) privAdd.onclick = function(){ addBucketItem('private','privateInput'); };

    document.querySelectorAll('.bl-check').forEach(function(c){
      c.onclick = function(){ toggleBucketItem(c.getAttribute('data-id')); };
    });
  }

  async function addBucketItem(section, inputId){
    var input = document.getElementById(inputId);
    var text = input.value.trim();
    if(!text || !state.config) return;
    state.bucketlist.unshift({id: uid(), text: text, done:false, addedBy: state.viewingAs, section: section});
    renderBucketlist();
    toast('Added');
    await fbSetRootField('bucketlist', state.bucketlist);
  }

  async function toggleBucketItem(id){
    var item = state.bucketlist.find(function(i){ return i.id===id; });
    if(!item) return;
    item.done = !item.done;
    renderBucketlist();
    await fbSetRootField('bucketlist', state.bucketlist);
  }

  /* ---------------- VISIT ---------------- */
  function renderVisit(){
    var el = document.getElementById('view-visit');
    var next = state.visits.next || {date:'', note:''};
    var html = '<div class="card">';
    html += '<div class="card-label">Next visit</div>';
    html += '<div class="field"><label>Date</label><input type="date" id="visitDate" value="'+(next.date||'')+'"></div>';
    html += '<div class="field"><label>Notes</label><textarea id="visitNote" placeholder="Flights, plans, anything to remember">'+(next.note||'')+'</textarea></div>';
    html += '<div class="visit-actions"><div class="btn btn-gold" id="saveVisit">Save</div>';
    if(next.date) html += '<div class="btn btn-ghost" id="logVisit">We did it!</div>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-label">Past visits</div>';
    if(state.visits.history.length===0){
      html += '<div class="empty">No visits logged yet.</div>';
    }else{
      html += state.visits.history.slice().reverse().map(function(v){
        return '<div class="history-item"><span>'+fmtDate(v.date)+'</span>'+escapeHtml(v.note||'')+'</div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="link-muted" id="exportLink">Export backup</div>';
    html += '<div class="link-muted" id="importLink">Import backup</div>';
    html += '<input type="file" id="importFileInput" accept="application/json" style="display:none">';
    html += '<div class="link-muted" id="editNamesLink">Change names</div>';
    html += '<div class="link-danger" id="resetLink">Reset all shared data</div>';

    el.innerHTML = html;

    document.getElementById('saveVisit').onclick = saveVisit;
    var lv = document.getElementById('logVisit');
    if(lv) lv.onclick = logVisit;
    document.getElementById('exportLink').onclick = exportBackup;
    document.getElementById('importLink').onclick = function(){ document.getElementById('importFileInput').click(); };
    document.getElementById('importFileInput').onchange = function(e){
      var f = e.target.files[0];
      if(f) confirmImport(f);
      e.target.value = '';
    };
    document.getElementById('editNamesLink').onclick = openSettings;
    document.getElementById('resetLink').onclick = confirmReset;
  }

  async function saveVisit(){
    var date = document.getElementById('visitDate').value;
    var note = document.getElementById('visitNote').value;
    if(!date){ toast('Pick a date first'); return; }
    state.visits.next = {date:date, note:note};
    renderVisit(); renderToday();
    toast('Saved');
    await fbSetRootField('visits', state.visits);
  }

  async function logVisit(){
    if(!state.visits.next) return;
    state.visits.history.push(state.visits.next);
    state.visits.next = null;
    renderVisit(); renderToday();
    toast("Logged — here's to the next one");
    await fbSetRootField('visits', state.visits);
  }

  /* ---------------- settings / setup ---------------- */
  function openSetup(){
    var ov = document.getElementById('overlay');
    ov.innerHTML = '<div class="modal">' +
      '<h3>Set up Same Sky</h3>' +
      '<p>What should we call the two of you? This is shared, so whoever sets it up first sets it for both.</p>' +
      '<div class="field"><label>Your name</label><input type="text" id="setupName1" placeholder="e.g. James"></div>' +
      '<div class="field"><label>Their name</label><input type="text" id="setupName2" placeholder="e.g. their name"></div>' +
      '<div class="modal-actions"><div class="btn btn-gold" id="setupSave">Start</div></div>' +
      '</div>';
    ov.classList.add('show');
    document.getElementById('setupSave').onclick = async function(){
      var n1 = document.getElementById('setupName1').value.trim();
      var n2 = document.getElementById('setupName2').value.trim();
      if(!n1 || !n2){ toast('Both names needed'); return; }
      state.config = {name1:n1, name2:n2};
      state.viewingAs = n1;
      ov.classList.remove('show');
      renderIdBar(); renderAll();
      await fbSetRootField('config', state.config);
    };
  }

  function openSettings(){
    if(!state.config){ openSetup(); return; }
    var ov = document.getElementById('overlay');
    ov.innerHTML = '<div class="modal">' +
      '<h3>Names</h3>' +
      '<p>Update how you both appear across the app.</p>' +
      '<div class="field"><label>Name 1</label><input type="text" id="editName1" value="'+state.config.name1+'"></div>' +
      '<div class="field"><label>Name 2</label><input type="text" id="editName2" value="'+state.config.name2+'"></div>' +
      '<div class="modal-actions"><div class="btn btn-ghost" id="settingsCancel">Cancel</div><div class="btn btn-gold" id="settingsSave">Save</div></div>' +
      '</div>';
    ov.classList.add('show');
    document.getElementById('settingsCancel').onclick = function(){ ov.classList.remove('show'); };
    document.getElementById('settingsSave').onclick = async function(){
      var n1 = document.getElementById('editName1').value.trim();
      var n2 = document.getElementById('editName2').value.trim();
      if(!n1 || !n2){ toast('Both names needed'); return; }
      state.config = {name1:n1, name2:n2};
      ov.classList.remove('show');
      renderIdBar(); renderAll();
      await fbSetRootField('config', state.config);
      toast('Updated');
    };
  }

  async function fetchWholeDateCollection(colRef){
    var out = {};
    try{
      var snap = await getDocs(colRef);
      snap.forEach(function(d){ out[d.id] = d.data(); });
    }catch(e){ /* leave out empty */ }
    return out;
  }

  async function exportBackup(){
    toast('Preparing backup…');
    var allCheckins = await fetchWholeDateCollection(checkinsCol());
    var allSelfies = await fetchWholeDateCollection(selfiesCol());
    var backup = {
      exportedAt: new Date().toISOString(),
      config: state.config,
      checkins: allCheckins,
      visits: state.visits,
      pings: state.pings,
      journal: state.journal,
      bucketlist: state.bucketlist,
      gallery: state.gallery.map(function(item){ return item.data; }),
      selfies: allSelfies
    };
    var blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'same-sky-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }

  function confirmImport(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try{ data = JSON.parse(e.target.result); }
      catch(err){ toast('Not a valid backup file'); return; }

      var ov = document.getElementById('overlay');
      ov.innerHTML = '<div class="modal">' +
        '<h3>Restore this backup?</h3>' +
        '<p>This replaces everything currently saved — check-ins, journal, bucket list, photos and visit plans — for both of you. This can\'t be undone.</p>' +
        '<div class="modal-actions"><div class="btn btn-ghost" id="cancelImport">Cancel</div><div class="btn btn-gold" id="doImport">Restore</div></div>' +
        '</div>';
      ov.classList.add('show');
      document.getElementById('cancelImport').onclick = function(){ ov.classList.remove('show'); };
      document.getElementById('doImport').onclick = async function(){
        ov.classList.remove('show');
        toast('Restoring…');

        state.config = data.config || null;
        state.visits = data.visits || {next:null, history:[]};
        state.pings = data.pings || [];
        state.journal = data.journal || [];
        state.bucketlist = data.bucketlist || [];
        if(state.config) state.viewingAs = state.config.name1;

        var writes = [
          fbSetRootField('config', state.config),
          fbSetRootField('visits', state.visits),
          fbSetRootField('pings', state.pings),
          fbSetRootField('journal', state.journal),
          fbSetRootField('bucketlist', state.bucketlist)
        ];
        var importedCheckins = data.checkins || {};
        Object.keys(importedCheckins).forEach(function(dateKey){
          writes.push(fbSetDateDoc(checkinsCol(), dateKey, importedCheckins[dateKey]));
        });
        var importedSelfies = data.selfies || {};
        Object.keys(importedSelfies).forEach(function(dateKey){
          writes.push(fbSetDateDoc(selfiesCol(), dateKey, importedSelfies[dateKey]));
        });
        await Promise.all(writes);

        await fbDeleteAllInCollection(galleryCol());
        var importedGallery = data.gallery || [];
        var galleryWrites = importedGallery.map(function(src, i){
          return addDoc(galleryCol(), {data:src, order:Date.now()+i});
        });
        await Promise.all(galleryWrites);

        await loadAll();
        renderIdBar(); renderAll();
        toast('Backup restored');
      };
    };
    reader.readAsText(file);
  }

  function confirmReset(){
    var ov = document.getElementById('overlay');
    ov.innerHTML = '<div class="modal">' +
      '<h3>Reset everything?</h3>' +
      '<p>This clears check-ins, memories, bucket list, pings, photos and visit plans for both of you. This can\'t be undone.</p>' +
      '<div class="modal-actions"><div class="btn btn-ghost" id="cancelReset">Cancel</div><div class="btn btn-gold" id="doReset" style="background:var(--rose)">Reset</div></div>' +
      '</div>';
    ov.classList.add('show');
    document.getElementById('cancelReset').onclick = function(){ ov.classList.remove('show'); };
    document.getElementById('doReset').onclick = async function(){
      ov.classList.remove('show');
      toast('Resetting…');
      state.todayCheckins = {}; state.visits={next:null,history:[]}; state.pings=[]; state.journal=[]; state.bucketlist=[]; state.gallery=[]; state.todaySelfies={};
      renderAll();
      await Promise.all([
        fbSetRootField('visits', state.visits),
        fbSetRootField('pings', state.pings),
        fbSetRootField('journal', state.journal),
        fbSetRootField('bucketlist', state.bucketlist),
        fbDeleteAllInCollection(checkinsCol()),
        fbDeleteAllInCollection(selfiesCol()),
        fbDeleteAllInCollection(galleryCol())
      ]);
      toast('Reset');
    };
  }

  /* ---------------- boot ---------------- */
  async function startApp(){
    await authReady;
    await loadAll();
    renderShell();
    renderIdBar();
    setTab('today');
    if(!state.config) openSetup();
  }

  function boot(){
    renderLockScreen();
  }
  boot();
})();
</script>
